branches:
  - main

name-template: 'Version $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

sort-by: title # sort alphabetically
sort-direction: ascending

# Categories match Keep a Changelog (https://keepachangelog.com/en/1.1.0/)
# exactly, so a drafted release's notes and CHANGELOG.md read the same way.
categories:
  - title: '### Added'
    labels:
      - 'changelog/added'
  - title: '### Changed'
    labels:
      - 'changelog/changed'
  - title: '### Deprecated'
    labels:
      - 'changelog/deprecated'
  - title: '### Removed'
    labels:
      - 'changelog/removed'
  - title: '### Fixed'
    labels:
      - 'changelog/fixed'
  - title: '### Security'
    labels:
      - 'changelog/security'

exclude-labels:
  - 'ignore-changelog'
  - 'tools'
  - 'documentation'

change-template: '* $TITLE (#$NUMBER) by $AUTHOR'
template: |
  _Requires [CBA_A3](https://github.com/CBATeam/CBA_A3) and [ACE3](https://github.com/acemod/ACE3)._

  ## Summary

  ## Changelog

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

# target/next-arma triggers a Major bump (breaking Arma-version support
# change); Removed items are treated as breaking too. Added/Changed/
# Deprecated trigger Minor; Fixed/Security trigger Patch.
version-resolver:
  major:
    labels:
      - 'target/next-arma'
      - 'changelog/removed'
  minor:
    labels:
      - 'changelog/added'
      - 'changelog/changed'
      - 'changelog/deprecated'
  patch:
    labels:
      - 'changelog/fixed'
      - 'changelog/security'
  default: patch

replacers:
  # Category titles
  # Release Drafter automatically makes the category as ## Heading
  # and we want them as ### Heading
  - search: '/\#\# (\#\#\# (Added|Changed|Deprecated|Removed|Fixed|Security))/g'
    replace: '$1'

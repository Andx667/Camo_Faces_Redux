site_name: Camo Faces Redux
site_description: An Arma 3 mod that lets players camouflage their faces during missions.
site_url: https://andx667.github.io/Camo_Faces_Redux/
repo_name: Andx667/CamoFacesRedux
repo_url: https://github.com/Andx667/CamoFacesRedux
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.path
    - navigation.indexes
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share

markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - abbr
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - privacy
  - search

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Scripting & API: scripting.md
  - Components:
      - components/index.md
      - Main: components/main.md
      - Common: components/common.md
      - Dialog: components/dialog.md
      - Faces: components/faces.md
      - Items: components/items.md
      - Zeus Enhanced Compat: components/compat_zen.md
  - Contributing: contributing.md
  - License: license.md
